server:
  port: 8080
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  idle_timeout_seconds: 60

mysql:
  host: localhost
  port: 3306
  username: root
  password: root
  database: exotel_monitoring
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime_hours: 1

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 20

scheduler:
  worker_pool_size: 20
  poll_interval_seconds: 60
  # Set to true to skip writing individual call_logs rows and accumulate snapshots
  # directly from the in-memory batch summary. Raw JSON is still saved in job_responses.
  # Default false = existing behaviour unchanged.
  skip_call_logs_write: true

slack:
  webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  enabled: false

email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  from: "monitoring@yourcompany.com"
  password: ""
  enabled: false

crypto:
  # AES-256 key for encrypting API tokens (32 bytes, base64-encoded)
  secret_key: "0T76IKOM3auGGd5pSGzmWonTnlVgWubZcSD/0pC/+Gc="

alerts:
  high_latency_threshold_ms: 3000
  max_retries: 3
  retry_base_delay_ms: 1000
  retry_max_delay_ms: 30000

exotel:
  base_url: "https://api.exotel.com"
  heartbeat_url: "https://my.exotel.com/heartbeat"
  timeout_seconds: 30
